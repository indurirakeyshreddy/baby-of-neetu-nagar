id: "vaa-rayil-vida"
title: "வா ரயில் விட"
text: |-
  வா ரயில் விட போலாமா
  உனக்கென்ன கோவமா
  மன்னிச்சிடு போலாம் வா

  ஏன் எட்டி நின்னு
  பாக்குற நீ
  கை புடிச்சு போவோமே
  அது போல போலாம் வா

  நீ புடிக்கும் எனக்கு
  உனக்கு நான் காய பழமா
  நீ வரியா நெசமா சொல்லு
  நான் வருவேனே

  வா ரயில் விட போலாமா
  உனக்கென்ன கோவமா
  மன்னிச்சிடு போலாம் வா

  இங்க நான்
  தனியா இருக்கேன்
  எதுக்குன்னு தெரியுமா
  நீயும் தான் தனியா இருக்க
  வந்து உன்ன பார்க்கவா

  ஒசத்தி கொறச்சல்
  என்னவோ எனக்கு அது புரியல
  அழுக்கா கருப்பா
  என்னவோ எனக்கு அது தெரியல

  நீயும் வேற நானும் வேற
  அம்மா அப்பா சொல்லிட்டாங்க
  நம்பாம நான் ஓடி வந்தேன்
  எங்க உன்னை காணும் இங்க

  வா ரயில் விட போலாமா
  வா.... (வந்து நீ சிரிக்கிற)
  ரயில் விட போலாமா (விளையாட போலாமா)
  வா (கை புடிச்சு போவோமா)
  ரயில் விட போலாமா (அது போல போலாம் வா)
  வா வா
  ரயில் விட போலாமா (வந்து நீ சிரிக்கிற)
  விளையாட போலாமா
  வா ரயில் விட போலாமா (கை புடிச்சு போவோமா)
  வா வா (அது போல போலாம் வா)
  ரயில் விட போலாம் வா
  வா ரயில் விட போலாமா
