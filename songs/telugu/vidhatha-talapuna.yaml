id: "vidhatha-talapuna"
title: "విధాత తలపున"
text: |-
  విధాత తలపున ప్రభవించినది అనాది జీవన వేదం ఓం
  ప్రాణనాడులకు స్పందననొసగిన ఆదిప్రణవనాదం ఓం
  కనుల కొలనులో ప్రతిబింబించిన విశ్వరూప విన్యాసం
  ఎదకనుమలలో ప్రతిధ్వనించిన విరించి విపంచి గానం
  అ అ ఆ

  సరసస్వర సురఝరీ గమనమౌ సామవేద సారమిది
  సరసస్వర సురఝరీ గమనమౌ సామవేద సారమిది
  నే పాడిన జీవన గీతం ఈ గీతం
  విరించినై విరచించితిని ఈ కవనం
  విపంచినై వినిపించితిని ఈ గీతం

  ప్రాగ్ధిష వీణియ పైన దినకర మయూఖతంత్రుల పైన
  జాగృత విహంగతతులె వినీల గగనపు వేదికపైన
  ప్రాగ్ధిష వీణియ పైన దినకర మయూఖతంత్రుల పైన
  జాగృత విహంగతతులె వినీల గగనపు వేదికపైన
  పలికిన కిలకిల త్వనముల స్వరగతి జగతికి శ్రీకారము కాగ విశ్వకార్యమునకిది భాష్యముగ
  విరించినై విరచించితిని ఈ కవనం
  విపంచినై వినిపించితిని ఈ గీతం

  జనించు ప్రతి శిశు గళమున పలికిన జీవననాద తరంగం
  చేతన పొందిన స్పందన ధ్వనించు హృదయ మృదంగ ధ్వానం
  జనించు ప్రతి శిశు గళమున పలికిన జీవననాద తరంగం
  చేతన పొందిన స్పందన ధ్వనించు హృదయ మృదంగ ధ్వానం
  అనాది రాగం ఆది తాళమున అనంత జీవన వాహినిగ సాగిన సృష్టి విలాసమునే
  విరించినై విరచించితిని ఈ కవనం
  విపంచినై వినిపించితిని ఈ గీతం

  నా ఉఛ్వాసం కవనం నా నిశ్వాసం గానం
  నా ఉఛ్వాసం కవనం నా నిశ్వాసం గానం
  సరసస్వర సురఝరీ గమనమౌ సామవేద సారమిది
  నే పాడిన జీవన గీతం ఈ గీతం
