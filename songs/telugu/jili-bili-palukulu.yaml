id: "jili-bili-palukulu"
title: "జిలి బిలి పలుకుల"
text: |-
  జిలి బిలి పలుకుల చిలిపిగ పలికిన
  ఓ మైనా మైనా
  కిల కిల నగవుల వలపులు చిలికిన
  ఓ మైనా మైనా
  మిల మిల మెరిసిన తార
  మిన్నుల విడిన క్లింతార
  మిల మిల మెరిసిన తార
  మిన్నుల విడిన క్లింతార
  మధువుల పెదవుల మమతలు విరిసిన
  ఓ మైనా ఓ మైనా
  కలలను పెంచకు కలతను దాచకు
  ఏమైనా ఓ మైనా
  జిలి బిలి పలుకుల చిలిపిగ పలికిన
  ఓ మైనా మైనా
  కిల కిల నగవుల వలపులు చిలికిన
  ఓ మైనా మైనా

  అడగను లే చిరునామా
   ఓ మైనా ఓ మైనా
  చిరునవ్వే పుట్టిల్లు నీకైనా నాకైనా
  తారలకే సిగపువ్వా తారాడే సిరి మువ్వ
  తారలకే సిగపువ్వా తారాడే సిరి మువ్వ
  హరివిల్లు రంగుల్లో వర్ణాలే
  చిలికిన చిలకవు ఉలకవు పలకవు
  ఓ మైనా ఏమైనా

  జిలి బిలి పలుకుల చిలిపిగ పలికిన
  ఓ మైనా మైనా
  కిల కిల నగవుల వలపులు చిలికిన
  ఓ మైనా మైనా
  మిల మిల మెరిసిన తార
  మిన్నుల విడిన క్లింతార
  మిల మిల మెరిసిన తార
  మిన్నుల విడిన క్లింతార
