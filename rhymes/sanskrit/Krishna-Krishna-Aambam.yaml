id: "Krishna-Krishna-Aambam"
title: "कृष्ण कृष्ण आमम्ब"
text: |-
  कृष्ण कृष्ण। आमम्ब।
  दुग्धं पीतम्। न अम्ब।
  वदसि असत्यम्। न अम्ब।
  मुखमुद्घाटय। हा हा हा॥

  कृष्ण कृष्ण। आमम्ब।
  दधिजम् अशितम्। न अम्ब।
  वदसि असत्यम्। न अम्ब।
  मुखमुद्घाटय। हा हा हा॥

  कृष्ण कृष्ण। आमम्ब।
  मृत्तिक भुक्ता। न अम्ब।
  वदसि असत्यम्। न अम्ब।
  मुखमुद्घाटय। हा हा हा॥
