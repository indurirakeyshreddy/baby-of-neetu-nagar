id: "chandamama"
title: "चंदा मामा दूर के"
text: |-
  चंदा मामा दूर के, पुए पकाएँ बूर के
  चंदा मामा दूर के, पुए पकाएँ बूर के

  आप खाएँ थाली में, क्लींतारा को दें प्याली में
  आप खाएँ थाली में, क्लींतारा को दें प्याली में

  प्याली गई टूट, क्लींतारा गई रूठ
  प्याली गई टूट, क्लींतारा गई रूठ

  लाएँगे हम प्यालियाँ, बजा-बजा के तालियाँ
  लाएँगे हम प्यालियाँ, बजा-बजा के तालियाँ

  क्लींतारा को मनाएँगे, दूध-मलाई खाएँगे
  क्लींतारा को मनाएँगे, दूध-मलाई खाएँगे

  चंदा मामा दूर के, पुए पकाएँ बूर के
  चंदा मामा दूर के, पुए पकाएँ बूर के

  आप खाएँ थाली में, क्लींतारा को दें प्याली में
  आप खाएँ थाली में, क्लींतारा को दें प्याली में
