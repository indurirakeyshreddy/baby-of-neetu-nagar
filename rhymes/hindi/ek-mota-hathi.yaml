id: "ek-mota-hathi"
title: "एक मोटा हाथी"
text: |-
  एक मोटा हाथी झूम के चला
  मकड़ी के जाल में जाके वो फँसा
  जाल को देखा, देख के डरा
  दूसरे हाथी को इशारे से बुलाया -
  "इधर आ, इधर आ, इधर आ"

  दो मोटे हाथी झूम के चले
  मकड़ी के जाल में जाके वो फँसे
  जाल को देखा, देख के डरे
  तीसरे हाथी को इशारे से बुलाया -
  "इधर आ, इधर आ, इधर आ"

  तीन मोटे हाथी झूम के चले
  मकड़ी के जाल में जाके वो फँसे
  जाल को देखा, देख के डरे
  चौथे हाथी को इशारे से बुलाया -
  "इधर आ, इधर आ, इधर आ"

  चार मोटे हाथी झूम के चले
  मकड़ी के जाल में जाके वो फँसे
  जाल को देखा, देख के डरे
  पांचवें हाथी को इशारे से बुलाया -
  "इधर आ, इधर आ, इधर आ"

  पांच मोटे हाथी झूम के चले
  मकड़ी के जाल में जाके वो फँसे
  जाल को देखा, देख के डरे
  और साथ मिलकर जाल को तोड़ दिया
  तोड़ दिया, तोड़ दिया, तोड़ दिया
