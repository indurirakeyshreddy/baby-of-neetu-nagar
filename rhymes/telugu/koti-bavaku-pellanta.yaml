id: "koti-bavaku-pellanta"
title: "కోతి బావకు పెళ్ళంట"
text: |-
  కోతి బావకు పెళ్ళంట
  కొండా కోనా విడిదంట

  కోతి బావకు పెళ్ళంట
  కొండా కోనా విడిదంట

  కుక్క నక్కల విందంటా
  ఏనుగు వడ్డన చేయునట
  ఎలుగు వింత చూచునట

  కోడి, కోకిల, కాకమ్మ
  కోతి పెళ్ళికి పాటంట
  నెమళ్ళు నాట్యం చేయునట

  ఒంటేలు డోలు వేయునట
  ఊరంతా శుభలేఖలట

  ఒంటేలు డోలు వేయునట
  ఊరంతా శుభలేఖలట
  వచ్చేవారికి విందులట

  పెళ్ళి పీటల పై కోతి బావ
  పళ్ళు ఇకిలించునట
