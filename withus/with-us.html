<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WithUs | BABY-OF-NEETU-NAGAR</title>
  <meta name="description" content="A cinematic live timeline showing how long KLINTARA has been with us." />
  <link rel="stylesheet" href="../shared/base.css" />
  <link rel="stylesheet" href="../shared/components.css" />
  <link rel="stylesheet" href="withus.css" />
  <link rel="stylesheet" href="../celebration/klintara-celebration.css" />
</head>

<body>
  <div class="background-layer" aria-hidden="true">
    <div class="aurora aurora-one"></div>
    <div class="aurora aurora-two"></div>
    <div class="orbital-ring"></div>
    <div class="sparkles" id="sparkles"></div>
  </div>

  <div class="cursor-glow" id="cursorGlow"></div>
  <div id="klintaraCelebration"></div>

  <div class="top-nav" aria-label="Page navigation">
    <a class="nav-btn" href="../index.html" data-target="home">Home</a>
    <a class="nav-btn" href="../rhymes/telugu-rhymes.html" data-target="rhymes">Rhymes</a>
    <a class="nav-btn" href="../scripts/scripts.html" data-target="scripts">Scripts</a>
    <a class="nav-btn active" href="with-us.html" data-target="with-us">WithUs</a>
  </div>

  <main class="page-shell">
    <section class="feature-section">
      <div class="feature-card withus-card">
        <p class="section-eyebrow"></p>
        <h1 class="withus-title">KLINTARA has been with us since</h1>
        <p class="withus-date">16 June 2026 • 10:34 AM</p>

        <div class="withus-timer" id="withUsTimer" aria-live="polite">
          <div class="withus-counter-card">
            <span class="withus-label">Years</span>
            <span class="withus-value" id="yearsValue">0</span>
          </div>
          <div class="withus-counter-card">
            <span class="withus-label">Months</span>
            <span class="withus-value" id="monthsValue">0</span>
          </div>
          <div class="withus-counter-card">
            <span class="withus-label">Days</span>
            <span class="withus-value" id="daysValue">0</span>
          </div>
        </div>

        <p id="withUsMessage" class="withus-message">Counting every cherished moment in real time.</p>
      </div>
    </section>
  </main>

  <script src="../script.js"></script>
  <script src="with-us.js"></script>
  <script src="../celebration/klintara-celebration.js"></script>
</body>

</html>
