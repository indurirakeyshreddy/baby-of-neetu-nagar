id: "nanhi_bitiya"
order: 1
title: "नन्ही बिटिया"
image: "images/Nanhi_Bitiya.jpg"
alt: "माँ अपनी नवजात बच्ची को गोद में लिए प्यार से देख रही हैं।"
text: |-
  नन्ही बिटिया तुझे जब देखूँ
  हज़ार आँखें भी कम पड़ेगी
  सबकी नज़र तुझ पर जो ठहरे
  कहीं तुझे नज़र न लग जाए
  इसलिए माँ की गोद में ही
  चुपके से तू छुपी रहना

  ओ चंदा मामा देखा क्या तुमने
  बिल्कुल तुमसी मेरी क्लींतारा
  धरती के आईने में जैसे
  तेरा ही रूप नज़र आता
  ओ चंदा मामा देखा क्या तुमने
  बिल्कुल तुमसी मेरी क्लींतारा
